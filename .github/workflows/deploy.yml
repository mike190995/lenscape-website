name: Automated Media Optimization & Cloud Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build, Optimize & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Node Dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        if: env.HAS_GCP_SECRET == 'true'
        uses: google-github-actions/auth@v2
        env:
          HAS_GCP_SECRET: ${{ secrets.GCP_SA_KEY != '' }}
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: env.HAS_GCP_SECRET == 'true'
        uses: google-github-actions/setup-gcloud@v2
        env:
          HAS_GCP_SECRET: ${{ secrets.GCP_SA_KEY != '' }}

      - name: Run Media Optimization Pipeline
        run: npm run optimize:media

      - name: Sync Media Assets to Cloud Storage CDN
        if: env.HAS_GCP_SECRET == 'true'
        env:
          HAS_GCP_SECRET: ${{ secrets.GCP_SA_KEY != '' }}
        run: |
          gcloud storage rsync -r public/Portfolio gs://lenscape-media-cdn/Portfolio \
            --cache-control="public, max-age=31536000, immutable"

      - name: Build Web Application
        run: npm run build

      - name: Deploy to Google Cloud Run
        if: env.HAS_GCP_SECRET == 'true'
        env:
          HAS_GCP_SECRET: ${{ secrets.GCP_SA_KEY != '' }}
        run: |
          gcloud run deploy lenscape-website \
            --source . \
            --project lenscape-company \
            --region us-east1 \
            --allow-unauthenticated \
            --quiet
