steps:
  # 1. Install dependencies
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']

  # 2. Run media optimization & WebP transformation
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'optimize:images']

  # 3. Synchronize assets to Cloud Storage CDN
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud storage rsync -r public/Portfolio gs://lenscape-media-cdn/Portfolio \
          --cache-control="public, max-age=31536000, immutable" || true

  # 4. Build web application
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']

  # 5. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'lenscape-website'
      - '--source=.'
      - '--project=lenscape-company'
      - '--region=us-east1'
      - '--allow-unauthenticated'
      - '--quiet'

timeout: '1200s'
